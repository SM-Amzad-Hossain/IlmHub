<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>99 Names of Allah — The Dial · ৯৯ নামের ঘড়ি</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Marcellus&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="dial.css" />
</head>
<body>

<header class="hd">
  <h1>99 NAMES OF ALLAH</h1>
  <div class="stress-row">
    <span class="s-label">STRESS</span>
    <span class="s-val" id="stressVal">99</span>
  </div>
  <div class="bar" aria-hidden="true">
    <div class="fill" id="stressFill"></div>
    <div class="segs"></div>
  </div>
</header>

<main class="stage-wrap">
  <div class="dial" id="dial">
    <div class="rim" aria-hidden="true"></div>
    <div class="face" aria-hidden="true"></div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>

    <!-- rotating wheel of 99 names -->
    <div class="wheel" id="wheel" role="group" aria-label="99-name clock face"></div>

    <!-- fixed red pointer at 12 o'clock -->
    <div class="needle" aria-hidden="true"><i></i></div>
  </div>
</main>

<section class="name-block">
  <div class="nm" id="nm">Al-Quddūs</div>
  <div class="mn" id="mn">The Most Holy</div>
  <div class="mn-bn" id="mnBn">পবিত্রতম</div>
  <div class="motto">SAY IT IN YOUR HEART</div>
  <div class="auto-controls">
    <button class="auto-play" id="autoPlayBtn" type="button" aria-pressed="false">▶ Auto Play 99 Names</button>
    <p class="auto-status" id="autoStatus" role="status" aria-live="polite">Starts from the selected name</p>
  </div>
  <div class="links">
    <a href="index.html">← <span class="lg-bn">মূল সাইট</span><span class="lg-en">Main site</span></a>
  </div>
  <p class="hint">
    <span class="lg-bn">ঘড়ির বৃত্তে চাপ দাও — ইচ্ছেমতো নামে ঘুরবে; কোনো নামে চাপ দিলে সেটাই বাছাই হবে।</span>
    <span class="lg-en">Tap the ring — the wheel spins to a name; tap any name to choose it.</span>
  </p>
</section>

<script src="dial.js"></script>
</body>
</html>
