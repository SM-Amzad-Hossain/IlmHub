<header class="reader-header"><a class="brand" href="index.html"><img class="brand-mark" src="assets/img/ilmhub-icon.svg" alt="" /> IlmHub</a><a href="index.html">← Home / হোম</a></header>
<main>
<div class="reader-intro"><p>READ · REFLECT · REMEMBER</p><h1>Al Quran <span lang="ar" dir="rtl">القرآن الكريم</span></h1><p lang="bn">পবিত্র কুরআন — বইয়ের পাতায় পড়ুন</p></div>
<div class="reader-controls"><label for="surah">Surah / সূরা</label><select id="surah" disabled><option>Loading…</option></select><label for="size">Text size</label><select id="size"><option value="27">Small</option><option value="33" selected>Medium</option><option value="40">Large</option></select></div>
<p id="status" role="status">Loading Quran text…</p><button id="retry" type="button" hidden>Retry loading</button>
<section class="book" aria-label="Quran reading spread" aria-busy="true"><article class="leaf" id="rightPage" lang="ar" dir="rtl"></article><article class="leaf" id="leftPage" lang="ar" dir="rtl"></article></section>
<nav class="page-controls" aria-label="Reading navigation"><button id="previous" type="button" disabled>← Previous</button><span id="progress"></span><button id="next" type="button" disabled>Next →</button></nav>
<p class="reader-note">Reading spreads are not traditional Mushaf page numbers.</p>
</main>
